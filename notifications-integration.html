<!-- إضافة أيقونة الإشعارات في الهيدر -->
<script>
  // إضافة أيقونة الإشعارات بعد تحميل الصفحة
  document.addEventListener('DOMContentLoaded', function() {
    const userControls = document.querySelector('.user-controls');
    if (userControls) {
      const notifBtn = document.createElement('button');
      notifBtn.className = 'notification-icon-btn';
      notifBtn.onclick = showNotificationCenter;
      notifBtn.id = 'notificationBtn';
      notifBtn.innerHTML = '<i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge" style="display: none;">0</span>';
      
      // إدراج قبل avatar
      userControls.insertBefore(notifBtn, userControls.querySelector('.user-avatar'));
    }
  }, { once: true });

  // تحديث عدد الإشعارات غير المقروءة
  function updateNotificationBadge() {
    if (!currentUser) return;
    const unread = allNotifications.filter(n => n.user_id === currentUser.id && !n.is_read).length;
    const badge = document.getElementById('notificationBadge');
    if (badge) {
      badge.textContent = unread;
      badge.style.display = unread > 0 ? 'flex' : 'none';
    }
  }

  // تحديث badge عند إضافة إشعار جديد
  const originalShowNotification = showNotificationToUser;
  window.showNotificationToUser = function(notification) {
    originalShowNotification(notification);
    updateNotificationBadge();
  };
</script>

<!-- ===== دمج الإشعارات مع نظام الطلبات =====-->
<script>
  // تعديل دالة updateOrderStatus لإرسال الإشعارات
  const originalUpdateOrderStatus = window.updateOrderStatus;
  window.updateOrderStatus = async function(newStatus) {
    if (originalUpdateOrderStatus) {
      const result = await originalUpdateOrderStatus(newStatus);
      
      // إرسال إشعار للعميل
      if (currentOrderId && currentUser) {
        const order = allOrders.find(o => o.id === currentOrderId);
        if (order) {
          await notifyOrderStatusChange(currentOrderId, newStatus, order);
        }
      }
      
      return result;
    }
  };

  // تعديل دالة createInvoice لإرسال الإشعارات
  const originalCreateInvoice = window.createInvoice;
  window.createInvoice = async function() {
    if (originalCreateInvoice) {
      const result = await originalCreateInvoice();
      
      // إرسال إشعار بالفاتورة الجديدة
      if (currentOrderId) {
        const order = allOrders.find(o => o.id === currentOrderId);
        if (order) {
          const invoiceNumber = `#${Date.now().toString().slice(-6)}`;
          await notifyInvoiceCreated(order.user_id, {
            invoice_number: invoiceNumber,
            total: order.service_price || 0
          });
        }
      }
      
      return result;
    }
  };
</script>

<!-- دالة إرسال الإشعار المخصص -->
<script>
  async function sendCustomNotification() {
    const userId = document.getElementById('notifUserId').value;
    const type = document.getElementById('notifType').value;
    const title = document.getElementById('notifTitle').value;
    const message = document.getElementById('notifMessage').value;

    if (!userId || !title || !message) {
      showAlert('❌ يرجى ملء جميع الحقول المطلوبة', 'danger', 3000);
      return;
    }

    const colorMap = {
      system: '#3b82f6',
      promotion: '#10b981',
      maintenance: '#f59e0b',
      urgent: '#ef4444'
    };

    const iconMap = {
      system: 'fas fa-bell',
      promotion: 'fas fa-gift',
      maintenance: 'fas fa-tools',
      urgent: 'fas fa-exclamation-circle'
    };

    try {
      if (userId === 'all') {
        const { data: users } = await sb.from('users').select('id');
        let sent = 0;
        for (const user of users || []) {
          await sendNotificationToUser(user.id, {
            type: type,
            title: title,
            message: message,
            icon: iconMap[type],
            color: colorMap[type]
          });
          sent++;
        }
        showAlert(`✅ تم إرسال الإشعار لـ ${sent} مستخدم`, 'success', 3000);
      } else {
        await sendNotificationToUser(parseInt(userId), {
          type: type,
          title: title,
          message: message,
          icon: iconMap[type],
          color: colorMap[type]
        });
        showAlert('✅ تم إرسال الإشعار بنجاح', 'success', 3000);
      }

      document.getElementById('customNotificationModal').style.display = 'none';
      document.getElementById('customNotificationForm').reset();
    } catch(err) {
      console.error('Error sending notification:', err);
      showAlert('❌ حدث خطأ في إرسال الإشعار', 'danger', 3000);
    }
  }

  // تحميل قائمة المستخدمين
  document.addEventListener('DOMContentLoaded', async function() {
    try {
      const { data: users } = await sb.from('users').select('id, name');
      const select = document.getElementById('notifUserId');
      if (select && users) {
        users.forEach(user => {
          const option = document.createElement('option');
          option.value = user.id;
          option.textContent = user.name || `مستخدم #${user.id}`;
          select.appendChild(option);
        });
      }
    } catch(e) {}
  }, { once: true });
</script>

<!-- ===== نموذج التذكيرات التلقائية ===== -->
<script>
  // جدولة التذكيرات التلقائية
  function scheduleAutomaticReminders() {
    // ال��حقق كل ساعة من الفواتير المتأخرة
    setInterval(() => {
      if (currentAdmin && notificationSettings.enableOverdueReminders) {
        sendOverduePaymentReminders();
      }
    }, 60 * 60 * 1000); // كل ساعة
  }

  // بدء الجدولة عند دخول الأدمن
  const originalShowAdminDashboard = window.showAdmin;
  window.showAdmin = function() {
    if (originalShowAdminDashboard) {
      originalShowAdminDashboard();
    }
    scheduleAutomaticReminders();
  };
</script>
